[project]
name = "mal-jml"
version = "0.1.0"
description = "Joiner-Mover-Leaver security automation across Okta, Google Workspace, 1Password and Jamf"
requires-python = ">=3.11"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S314", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
